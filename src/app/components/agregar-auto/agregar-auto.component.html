<ion-header>
  <ion-toolbar>
    <ion-title style="text-align: center;">
      Agrega un nuevo automovil
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (ngSubmit)="agregarAuto()" [formGroup]="autoNuevo" style="margin: 5%;">
    <ion-select *ngIf="showPlantSelector" label="Planta destino *" label-placement="floating" fill="outline" formControlName="plantaId" (ionChange)="onPlantChange($event.detail.value)">
      <ion-select-option *ngFor="let plant of plants" [value]="plant.id">{{ plant.nombre }}</ion-select-option>
    </ion-select>
    <ion-note *ngIf="!showPlantSelector">La unidad se registrará en el contexto de planta activo.</ion-note>
    <br>
    <ion-input label="Agrega las placas de la unidad" label-placement="floating" fill="outline" placeholder="Placas"
      style="--background: #ffffff;" formControlName="unidad">
    </ion-input>
    <br>
    <ion-select label="Distribuidor operador *" label-placement="floating" fill="outline"
      formControlName="operadorId" interface="popover" (ionChange)="seleccionarOperador($event.detail.value)">
      <ion-select-option [value]="null">Selecciona un distribuidor activo</ion-select-option>
      <ion-select-option *ngFor="let distribuidor of operadoresDisponibles" [value]="distribuidor.id">{{ distribuidor.nombre }}</ion-select-option>
    </ion-select>
    <br>
    <ion-input label="Nombre del operador (compatibilidad histórica)" label-placement="floating" fill="outline" placeholder="Operador"
      style="--background: #ffffff;" formControlName="operador" [readonly]="true">
    </ion-input>
    <br>

    <ion-row>
      <ion-col size="4">
        <ion-input label="Establece el Kilometraje inicial" type="number" label-placement="floating" fill="outline"
          placeholder="Kilometraje" style="--background: #ffffff;" formControlName="kilometraje" (ionChange)="establecerKilometraje()">
        </ion-input>
      </ion-col>
      <ion-col size="4">
        <ion-input label="Establece el kilometraje actual" type="number" label-placement="floating" fill="outline"
          placeholder="Kilometraje" style="--background: #ffffff;" formControlName="km_actual">
        </ion-input>
      </ion-col>
      <ion-col size="4">
        <ion-input label="Establece el Kilometraje proximo servicio" type="number" label-placement="floating" fill="outline"
          placeholder="Kilometraje" style="--background: #ffffff;" formControlName="km_proximo_servicio">
        </ion-input>
      </ion-col>
    </ion-row>

    <br>
    <ion-textarea label="Outline textarea" labelPlacement="floating" fill="outline" placeholder="Enter text"
      [autoGrow]="true" rows="10" style="--background: #ffffff;" formControlName="desc">
    </ion-textarea>
    <br>
    <ion-button type="submit" expand="block" fill="clear" shape="round" color="success">
      Agregar auto
    </ion-button>
  </form>
</ion-content>
