<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú" (click)="closeMobileMenu()"></button>

<aside class="autolog-sidebar" [class.is-collapsed]="isCollapsed" [class.is-open]="isMobileOpen" aria-label="Navegación principal">
  <div class="brand-row">
    <div class="brand-mark" aria-hidden="true"><ion-icon name="car-sport"></ion-icon></div>
    <div class="brand-copy"><strong>Autolog</strong><span>Control operativo</span></div>
    <button class="collapse-button" type="button" (click)="toggleSidebar()"
      [attr.aria-label]="isCollapsed ? 'Expandir menú' : 'Plegar menú'" [attr.aria-expanded]="!isCollapsed"
      [title]="isCollapsed ? 'Expandir menú' : 'Plegar menú'">
      <ion-icon [name]="isCollapsed ? 'chevron-forward-outline' : 'chevron-back-outline'" aria-hidden="true"></ion-icon>
    </button>
  </div>

  <div class="navigation-search" [class.has-value]="searchQuery">
    <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
    <input #navigationSearch type="search" [value]="searchQuery" (input)="onSearch($event)"
      placeholder="Buscar en Autolog..." aria-label="Buscar en la navegación de Autolog" autocomplete="off">
    <button *ngIf="searchQuery" type="button" (click)="clearSearch()" aria-label="Limpiar búsqueda">
      <ion-icon name="close-circle" aria-hidden="true"></ion-icon>
    </button>
  </div>
  <button class="compact-search" type="button" (click)="openSearch()" title="Buscar en Autolog" aria-label="Buscar en Autolog">
    <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
  </button>

  <nav class="sidebar-nav" aria-label="Secciones de AUTOLOG">
    <section class="nav-group" *ngFor="let group of visibleGroups" [attr.aria-labelledby]="'nav-group-' + group.id">
      <button *ngIf="group.collapsible; else directGroupTitle" class="nav-group-toggle" type="button"
        [id]="'nav-group-' + group.id" (click)="toggleGroup(group)" [attr.aria-expanded]="isGroupOpen(group)"
        [attr.aria-controls]="'nav-items-' + group.id" [title]="group.label">
        <ion-icon class="group-icon" [name]="group.icon" aria-hidden="true"></ion-icon>
        <span>{{ group.label }}</span>
        <ion-icon class="group-chevron" name="chevron-down-outline" aria-hidden="true"></ion-icon>
      </button>
      <ng-template #directGroupTitle><span class="nav-group-title" [id]="'nav-group-' + group.id">{{ group.label }}</span></ng-template>

      <div class="nav-group-items" [class.is-expanded]="isGroupOpen(group)" [id]="'nav-items-' + group.id"
        [attr.aria-hidden]="!isGroupOpen(group)">
        <div class="nav-group-items-inner">
          <button class="nav-item" type="button" *ngFor="let item of group.items"
            [class.active]="isActive(item.route)" (click)="navigate(item)" [title]="item.label"
            [attr.aria-current]="isActive(item.route) ? 'page' : null">
            <ion-icon [name]="item.icon" aria-hidden="true"></ion-icon><span>{{ item.label }}</span>
          </button>
        </div>
      </div>
    </section>

    <div class="navigation-empty" *ngIf="isSearching && !visibleGroups.length" role="status">
      <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
      <span>No encontramos una opción.</span>
    </div>
  </nav>

  <div class="sidebar-footer">
    <button class="user-card" type="button" (click)="rToMiPerfil()" title="Mi perfil">
      <span class="avatar">{{ userName.charAt(0) | uppercase }}</span>
      <span class="user-copy"><strong>{{ userName }}</strong><small>{{ roleLabel }}</small></span>
    </button>
    <button class="nav-item logout-item" type="button" (click)="logout()" title="Cerrar sesión">
      <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon><span>Cerrar sesión</span>
    </button>
  </div>
</aside>

<header class="autolog-topbar">
  <button class="topbar-menu-button" type="button" (click)="toggleSidebar()" aria-label="Abrir o plegar menú" [attr.aria-expanded]="isMobileOpen || !isCollapsed">
    <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
  </button>
  <div class="topbar-copy">
    <h1>{{ pageTitle }}</h1>
    <p *ngIf="pageDescription">{{ pageDescription }}</p>
  </div>
  <label class="plant-context" *ngIf="plantState.ready && plantState.plants.length">
    <span>Contexto</span>
    <select [value]="plantState.activePlantId || ''" (change)="onPlantChange($event)">
      <option *ngIf="plantScope.isGlobal()" value="">Todas las plantas</option>
      <option *ngFor="let plant of plantState.plants" [value]="plant.id">{{ plantOptionLabel(plant.id) }}</option>
    </select>
  </label>
  <button class="topbar-profile" type="button" (click)="rToMiPerfil()" title="Mi perfil">
    <span class="avatar">{{ userName.charAt(0) | uppercase }}</span>
    <span><strong>{{ userName }}</strong><small>{{ roleLabel }}</small></span>
  </button>
</header>
