<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú" (click)="closeMobileMenu()"></button>

<aside class="autolog-sidebar" [class.is-collapsed]="isCollapsed" [class.is-open]="isMobileOpen" aria-label="Navegación principal">
  <div class="brand-row">
    <div class="brand-mark" aria-hidden="true"><ion-icon name="car-sport"></ion-icon></div>
    <div class="brand-copy"><strong>Autolog</strong><span>Control operativo</span></div>
    <button class="collapse-button" type="button" (click)="toggleSidebar()"
      [attr.aria-label]="isCollapsed ? 'Expandir menú' : 'Plegar menú'" [attr.aria-expanded]="!isCollapsed"
      [title]="isCollapsed ? 'Expandir menú' : 'Plegar menú'">
      <ion-icon [name]="isCollapsed ? 'chevron-forward-outline' : 'chevron-back-outline'"></ion-icon>
    </button>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-group">
      <span class="nav-group-title">General</span>
      <button class="nav-item" type="button" [class.active]="isActive('/home')" (click)="rToPanelControl()" title="Resumen">
        <ion-icon name="grid-outline"></ion-icon><span>Resumen</span>
      </button>
    </div>

    <div class="nav-group">
      <span class="nav-group-title">Ventas</span>
      <button class="nav-item" type="button" [class.active]="isActive('/panel-control')" (click)="rToPanelVentas()" title="Panel de ventas">
        <ion-icon name="pie-chart-outline"></ion-icon><span>Panel de ventas</span>
      </button>
      <button class="nav-item" type="button" [class.active]="isActive('/historial')" (click)="rToHistorialVentas()" title="Historial e incidentes">
        <ion-icon name="receipt-outline"></ion-icon><span>Historial e incidentes</span>
      </button>
      <button class="nav-item" type="button" [class.active]="isActive('/distribuidores')" (click)="rToDistribu()" title="Distribuidores">
        <ion-icon name="people-outline"></ion-icon><span>Distribuidores</span>
      </button>
      <button class="nav-item" type="button" [class.active]="isActive('/generar-codigos')" (click)="rToGenerarCodigo()" title="Generar códigos QR" *ngIf="userRole == 'admin'">
        <ion-icon name="qr-code-outline"></ion-icon><span>Generar códigos QR</span>
      </button>
      <button class="nav-item" type="button" [class.active]="isActive('/productos')" (click)="rToProductos()" title="Productos y cilindros" *ngIf="userRole == 'admin'">
        <ion-icon name="cube-outline"></ion-icon><span>Productos y cilindros</span>
      </button>
      <button class="nav-item" type="button" [class.active]="isActive('/sorteos')" (click)="rToSroteos()" title="Sorteos">
        <ion-icon name="gift-outline"></ion-icon><span>Sorteos</span>
      </button>
    </div>

    <div class="nav-group">
      <span class="nav-group-title">Flotilla</span>
      <button class="nav-item" type="button" [class.active]="isActive('/home')" (click)="rToPanelControl()" title="Panel de servicios">
        <ion-icon name="speedometer-outline"></ion-icon><span>Panel de servicios</span>
      </button>
      <button class="nav-item" type="button" [class.active]="isActive('/autos')" (click)="rToAutosPage()" title="Unidades">
        <ion-icon name="car-outline"></ion-icon><span>Unidades</span>
      </button>
      <button class="nav-item" type="button" [class.active]="isActive('/articulos')" (click)="rToPageArticulos()" title="Artículos">
        <ion-icon name="construct-outline"></ion-icon><span>Artículos</span>
      </button>
    </div>

    <div class="nav-group">
      <span class="nav-group-title">Expendio</span>
      <button class="nav-item" type="button" [class.active]="isActive('/panel-expendio')"
        (click)="rToPanelExpendio()" title="Panel de expendio">
        <ion-icon name="storefront-outline"></ion-icon><span>Panel de expendio</span>
      </button>
    </div>

    <div class="nav-group" *ngIf="userRole == 'admin'">
      <span class="nav-group-title">Herramientas</span>
      <button class="nav-item" type="button" [class.active]="isActive('/convertidor-dictamen')" (click)="rToConvertidor()" title="Convertidor de dictámenes">
        <ion-icon name="code-slash-outline"></ion-icon><span>Convertidor de dictámenes</span>
      </button>
    </div>

    <div class="nav-group" *ngIf="userRole == 'admin'">
      <span class="nav-group-title">Administración</span>
      <button class="nav-item" type="button" [class.active]="isActive('/usuarios')" (click)="rToAdmUsuarios()" title="Usuarios">
        <ion-icon name="person-add-outline"></ion-icon><span>Usuarios</span>
      </button>
    </div>
  </nav>

  <div class="sidebar-footer">
    <button class="user-card" type="button" (click)="rToMiPerfil()" title="Mi perfil">
      <span class="avatar">{{ userName.charAt(0) | uppercase }}</span>
      <span class="user-copy"><strong>{{ userName }}</strong><small>{{ userRole == 'admin' ? 'Administrador' : 'Capturista' }}</small></span>
    </button>
    <button class="nav-item logout-item" type="button" (click)="logout()" title="Cerrar sesión">
      <ion-icon name="log-out-outline"></ion-icon><span>Cerrar sesión</span>
    </button>
  </div>
</aside>

<header class="autolog-topbar">
  <button class="topbar-menu-button" type="button" (click)="toggleSidebar()" aria-label="Abrir o plegar menú" [attr.aria-expanded]="isMobileOpen || !isCollapsed">
    <ion-icon name="menu-outline"></ion-icon>
  </button>
  <div class="topbar-copy">
    <h1>{{ pageTitle }}</h1>
    <p *ngIf="pageDescription">{{ pageDescription }}</p>
  </div>
  <button class="topbar-profile" type="button" (click)="rToMiPerfil()" title="Mi perfil">
    <span class="avatar">{{ userName.charAt(0) | uppercase }}</span>
    <span><strong>{{ userName }}</strong><small>{{ userRole == 'admin' ? 'Administrador' : 'Capturista' }}</small></span>
  </button>
</header>
